# Run the whole app: docker compose up --build   ->   http://localhost:8080
# Secrets come from server/.env (copy server/.env.example). MONGO_URI and the URLs
# below override what's in that file.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/aashraya
      CLIENT_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      TRUST_PROXY: "1"
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
